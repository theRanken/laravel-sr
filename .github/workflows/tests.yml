name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Configure Composer dependencies
        run: |
          composer require --no-interaction --no-update illuminate/console:${{ matrix.laravel }} illuminate/support:${{ matrix.laravel }}
          composer require --dev --no-interaction --no-update orchestra/testbench:${{ matrix.testbench }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run test suite
        run: composer test
